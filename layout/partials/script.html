<script>
	(function () {
		// Timecode linkification only makes sense on an episode page: it needs the single
		// #WaveformAudio to seek, and the .PlayerUI__cue markup it produces is a contract
		// with Cues in Waveform.js. On the home page there is no such audio element, so
		// bail out rather than rewriting every <p> on the page for links that cannot work.
		const root = document.querySelector('.Episode__Contents');
		const audioEl = document.getElementById('WaveformAudio');
		if (!root || !audioEl) return;

		function gotoTime(time) {
			audioEl.currentTime = time;
			audioEl.play();
		}

		function addLink(p, replace, time) {
			const text = p.innerHTML;
			if (text.includes(replace)) {
				const link = "<a class='PlayerUI__cue' data-cue-time='" + time + "'>" + replace + "</a>";
				p.innerHTML = text.replace(replace, link + ' <span class="PlayerUI__cue-text">') + '</span>';
			}
		}

		function getTimecode(hours, minutes, seconds) {
			return hours * 3600 + minutes * 60 + seconds;
		}

		const paragraphs = root.getElementsByTagName('p');
		for (let i = 0; i < paragraphs.length; i++) {
			const p = paragraphs[i];
			const text = p.innerHTML;
			let m = text.match(/(\d{1,2})\:(\d{2})\:(\d{2})/); // 00:00:00 or 0:00:00
			if (m) {
				addLink(p, m[1] + ":" + m[2] + ":" + m[3], getTimecode(parseInt(m[1]), parseInt(m[2]), parseInt(m[3])));
				continue;
			}
			m = text.match(/(\d{2,3})\-(\d{2})/); // 00-00 or 000-00
			if (m) {
				addLink(p, m[1] + "-" + m[2], getTimecode(0, parseInt(m[1]), parseInt(m[2])));
			}
			m = p.innerHTML.match(/(\d{2,3})\:(\d{2})/); // 00:00 or 000:00
			if (m) {
				addLink(p, m[1] + ":" + m[2], getTimecode(0, parseInt(m[1]), parseInt(m[2])));
			}
		}

		// One delegated listener instead of an inline onclick per cue.
		root.addEventListener('click', function (e) {
			const cue = e.target.closest('.PlayerUI__cue');
			if (!cue) return;
			e.preventDefault();
			gotoTime(Number(cue.dataset.cueTime));
		});
	})();
</script>
