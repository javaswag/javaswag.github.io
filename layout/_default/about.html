<!doctype html>
<html lang="{{ .Site.LanguageCode }}">

<head>
  {{ partial "meta.html" . }}
</head>

<body>
  <div class="Container">
    {{ partial "header.html" . }}

    <main class="Main">
      <div class="Fixed__Width Guests__Fixed">
        <h1>{{ .Title }}</h1>
        <div class="Episode__Contents">
          {{ .Content }}
        </div>
      </div>
    </main>

    {{ partial "footer.html" . }}
  </div>
  {{ partial "script.html" . }}
</body>

</html>
